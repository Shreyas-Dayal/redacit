[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapper-llm"
version = "0.1.0"
description = "Privacy-preserving LLM wrapper with PII anonymization."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.26.0",
    "presidio-analyzer>=2.2.361",
    "presidio-anonymizer>=2.2.361",
    "python-dotenv>=1.2.2",
    "typer>=0.12",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
server  = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
litellm = ["litellm>=1.40"]
dev     = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[project.scripts]
wrapper-llm = "privacy_wrapper.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.pytest.ini_options]

[tool.setuptools.packages.find]
where = ["src"]
