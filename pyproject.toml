[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapper-llm"
version = "0.1.0"
description = "Privacy-preserving LLM wrapper with PII anonymization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shreyas Dayal", email = "200020134@iitb.ac.in" },
]
keywords = [
    "privacy", "pii", "anonymization", "llm", "presidio",
    "openai", "anthropic", "gemini", "data-privacy", "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "openai>=2.26.0",
    "presidio-analyzer>=2.2.361",
    "presidio-anonymizer>=2.2.361",
    "python-dotenv>=1.2.2",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.optional-dependencies]
model-sm = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
model-md = [
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]
model-lg = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
server  = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
litellm = ["litellm>=1.40"]
dev     = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[project.scripts]
wrapper-llm = "privacy_wrapper.cli:app"

[project.urls]
Homepage = "https://github.com/Shreyas-Dayal/wrapper-llm"
Repository = "https://github.com/Shreyas-Dayal/wrapper-llm"
Documentation = "https://github.com/Shreyas-Dayal/wrapper-llm#readme"
Issues = "https://github.com/Shreyas-Dayal/wrapper-llm/issues"
Changelog = "https://github.com/Shreyas-Dayal/wrapper-llm/releases"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]

[tool.setuptools.packages.find]
where = ["src"]
